<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Romaneio / Manifesto - Logistics XPRESS</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 18px; background:#f5f5f5; color:#222; }
    .container { max-width:1100px; margin:0 auto; background:#fff; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.08); }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .title { font-size:18px; font-weight:700; }
    .meta { font-size:13px; color:#444; }
    table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
    th, td { border:1px solid #bbb; padding:8px 10px; text-align:left; vertical-align:top; }
    th { background:#eee; font-weight:700; }
    .right { text-align:right; }
    .totals { margin-top:12px; font-weight:700; text-align:right; }
    .btns { margin-top:14px; display:flex; gap:8px; justify-content:flex-end; }
    button { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; background:#28a745; color:#fff; }
    button.secondary { background:#6c757d; }
    .pedido-row { background:#fafafa; }
    .pedido-details { font-size:13px; color:#333; }
    .collapse { cursor:pointer; color:#0056b3; text-decoration:underline; background:transparent; border:none; padding:0; }
    .small { font-size:12px; color:#555; }
    @media print {
      .btns, .collapse { display:none !important; }
      body { background: #fff; padding: 0; }
      .container { box-shadow:none; padding:0; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <div>
        <div class="title" id="main-title">ROMANEIO</div>
        <div class="meta" id="subtitle">Carregando...</div>
      </div>
      <div class="meta" id="meta-right"></div>
    </div>

    <!-- Informações quick -->
    <div id="info-block" class="small" style="margin-bottom:10px;"></div>

    <!-- Tabela de Notas / Romaneio -->
    <table aria-label="Tabela de Notas">
      <thead>
        <tr>
          <th style="width:20%">NF / Nº</th>
          <th style="width:18%">ID NF</th>
          <th style="width:12%">Pedidos (códigos)</th>
          <th style="width:10%">Volumes</th>
          <th style="width:20%" class="right">Valor (R$)</th>
        </tr>
      </thead>
      <tbody id="tb-notas">
        <!-- preenchido via JS -->
      </tbody>
    </table>

    <div class="totals" id="total-geral">VALOR TOTAL: R$ 0,00 | VOLUMES: 0</div>

    <div class="btns">
      <button id="btn-calcular" type="button">Recalcular Totais</button>
      <button id="btn-print" class="secondary" type="button">Imprimir</button>
    </div>

    <!-- Lista detalhada de pedidos + itens -->
    <h4 style="margin-top:18px;">Detalhes por Pedido</h4>
    <div id="detalhes-pedidos"></div>
  </div>

<script>
(function () {
  // Utilitários
  const money = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v || 0));
  const safe = v => (v === null || v === undefined) ? '' : v;

  // Recebe mensagem do pai (gestao.js)
  window.addEventListener('message', (event) => {
    // Segurança: se quiser checar origem, ajuste allowedOrigin.
    // const allowedOrigin = 'http://localhost:8080';
    // if (event.origin !== allowedOrigin) return;

    const data = event.data;
    if (!data || data.tipo !== 'romaneio:load' || !data.dadosRomaneio) return;

    try {
      preencherRomaneio(data.dadosRomaneio);
    } catch (err) {
      console.error('Erro ao preencher romaneio:', err);
    }
  }, false);

  // Função principal que recebe o objeto conforme seu payload
  function preencherRomaneio(dados) {
    const recebimento = dados.recebimento || {};
    const pedidos = Array.isArray(dados.pedidos) ? dados.pedidos : (recebimento.pedidos || []);
    const origemHub = dados.origemHub || null;
    const destinoHub = dados.destinoHub || null;

    // Cabeçalho
    document.getElementById('main-title').textContent = `ROMANEIO - Recebimento #${safe(recebimento.id)}`;
    document.getElementById('subtitle').textContent = `Manifesto: ${safe(recebimento.numero_manifesto)}  •  Status: ${safe(recebimento.status)}  •  Operador: ${recebimento.Usuario?.nome || ''}`;
    document.getElementById('meta-right').textContent = `Criado: ${recebimento.data_criacao ? new Date(recebimento.data_criacao).toLocaleString() : ''}`;

    // Info quick (hubs / endereço)
    let infoHtml = '';
    if (origemHub || destinoHub) {
      infoHtml += `<strong>Origem:</strong> ${origemHub?.nome || safe(recebimento.origem_hub_id)} &nbsp; → &nbsp; <strong>Destino:</strong> ${destinoHub?.nome || safe(recebimento.destino_hub_id)}<br>`;
    }
    if (recebimento.endereco || recebimento.endereco_id) {
      infoHtml += `<strong>Endereço:</strong> ${recebimento.endereco || ('ID ' + recebimento.endereco_id)}<br>`;
    }
    document.getElementById('info-block').innerHTML = infoHtml;

    // Preencher tabela de notas: queremos uma linha por nota (podem haver múltiplas notas por pedido).
    const tb = document.getElementById('tb-notas');
    tb.innerHTML = '';

    // Mapa de notaId -> { nota, pedidos: [], volumes: number, valor: number }
    const mapaNotas = new Map();

    // Se pedidos vierem com 'nota' (array), percorre
    pedidos.forEach(p => {
      const pedidoCode = p.codigo_pedido || p.id;
      // calcular volumes do pedido: preferir soma dos itens.quantidade se existir, senão usar p.quantidade
      let volumesPedido = 0;
      if (Array.isArray(p.itens) && p.itens.length > 0) {
        volumesPedido = p.itens.reduce((s, it) => s + (Number(it.quantidade || 0)), 0);
      } else {
        volumesPedido = Number(p.quantidade || 0);
      }

      const notas = Array.isArray(p.nota) ? p.nota : [];
      if (notas.length === 0) {
        // criar uma "nota placeholder" por pedido sem nota
        const key = `__SEM_NOTA__::${pedidoCode}`;
        if (!mapaNotas.has(key)) mapaNotas.set(key, { nota: { numero: 'SEM-NF' }, pedidos: [], volumes: 0, valor: 0 });
        const entry = mapaNotas.get(key);
        entry.pedidos.push(pedidoCode);
        entry.volumes += volumesPedido;
        // se o pedido tiver itens com valor_total, somar
        if (Array.isArray(p.itens)) {
          entry.valor += p.itens.reduce((s, it) => s + (Number(it.valor_total || 0)), 0);
        }
        return;
      }

      notas.forEach(nf => {
        const key = `NF::${nf.id || nf.numero}`;
        if (!mapaNotas.has(key)) {
          mapaNotas.set(key, { nota: nf, pedidos: [], volumes: 0, valor: 0 });
        }
        const entry = mapaNotas.get(key);
        entry.pedidos.push(pedidoCode);
        entry.volumes += volumesPedido;
        // preferir nf.valor_total caso setado, senão somar itens do pedido
        const nfValor = Number(nf.valor_total || 0);
        if (nfValor > 0) {
          // Somar valor da nota (apagar duplicação se várias linhas apontarem para mesma nota)
          // Para evitar somar a mesma nota várias vezes por itens de diferentes pedidos, guardamos a soma incremental, mas
          // se a mesma nota aparecer por múltiplos pedidos que referenciam sama nota, assumimos que a nota pertence a 1 pedido apenas.
          // Aqui vamos apenas garantir que valor da nota seja o valor registrado na nota (não acumulado por pedido)
          entry.valor = nfValor;
        } else {
          // sem valor na nota -> usar total dos itens do pedido
          entry.valor += p.itens ? p.itens.reduce((s, it) => s + (Number(it.valor_total || 0)), 0) : 0;
        }
      });
    });

    // Agora gerar linhas da tabela a partir de mapaNotas (mantendo ordem)
    let totalValor = 0;
    let totalVolumes = 0;

    for (const [key, e] of mapaNotas.entries()) {
      const nf = e.nota || {};
      const numero = nf.numero || '—';
      const id = nf.id || '-';
      const pedidosList = e.pedidos.join(', ');
      const volumes = e.volumes || 0;
      const valor = Number(e.valor || 0);

      totalVolumes += volumes;
      totalValor += valor;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${numero}</strong><div class="small">Série: ${safe(nf.serie) || '-'}</div></td>
        <td>${id}</td>
        <td class="pedido-codes">${pedidosList}</td>
        <td class="right">${volumes}</td>
        <td class="right">${money(valor)}</td>
      `;
      tb.appendChild(tr);
    }

    // Preencher totals
    document.getElementById('total-geral').textContent = `VALOR TOTAL: ${money(totalValor)} | VOLUMES: ${totalVolumes}`;

    // Preencher detalhes por pedido (expansível)
    const detalheEl = document.getElementById('detalhes-pedidos');
    detalheEl.innerHTML = '';
    pedidos.forEach(p => {
      const card = document.createElement('div');
      card.style.border = '1px solid #ddd';
      card.style.padding = '10px';
      card.style.marginBottom = '8px';
      card.className = 'pedido-row';

      const pedidoHeader = document.createElement('div');
      pedidoHeader.innerHTML = `<strong>Pedido:</strong> ${safe(p.codigo_pedido || p.id)} &nbsp; <span class="small">Status: ${safe(p.status)}</span>
        &nbsp; <button class="collapse" data-pedido="${p.id}">Mostrar itens</button>`;
      card.appendChild(pedidoHeader);

      const itensDiv = document.createElement('div');
      itensDiv.className = 'pedido-details';
      itensDiv.style.display = 'none';
      // itens
      if (Array.isArray(p.itens) && p.itens.length) {
        const itHtml = ['<table style="width:100%; margin-top:8px;"><thead><tr><th>Produto</th><th>Qtd</th><th>Valor Unit.</th><th class="right">Valor Total</th></tr></thead><tbody>'];
        p.itens.forEach(it => {
          const prod = it.produtos || {};
          itHtml.push(`<tr>
            <td>${safe(prod.nome) || safe(it.descricao) || '—'}</td>
            <td>${Number(it.quantidade || 0)}</td>
            <td>${money(Number(it.valor_unitario || prod.preco || 0))}</td>
            <td class="right">${money(Number(it.valor_total || 0))}</td>
          </tr>`);
        });
        itHtml.push('</tbody></table>');
        itensDiv.innerHTML = itHtml.join('');
      } else {
        itensDiv.innerHTML = '<div class="small">Sem itens detalhados</div>';
      }

      // notas relacionadas
      const notas = Array.isArray(p.nota) ? p.nota : [];
      if (notas.length) {
        const notasHtml = notas.map(nf => `<div class="small" style="margin-top:8px;"><strong>NF:</strong> ${nf.numero} — Valor: ${money(nf.valor_total)} — Emissão: ${nf.data_emissao ? new Date(nf.data_emissao).toLocaleString() : '-'}</div>`).join('');
        itensDiv.innerHTML += notasHtml;
      }

      card.appendChild(itensDiv);
      detalheEl.appendChild(card);
    });

    // Adicionar handlers collapse
    document.querySelectorAll('.collapse').forEach(btn => {
      btn.onclick = (ev) => {
        const pid = btn.getAttribute('data-pedido');
        const parent = btn.closest('.pedido-row');
        const detail = parent.querySelector('.pedido-details');
        if (detail.style.display === 'none') { detail.style.display = 'block'; btn.textContent = 'Ocultar itens'; }
        else { detail.style.display = 'none'; btn.textContent = 'Mostrar itens'; }
      };
    });

  } // preencherRomaneio

  // Botões
  document.getElementById('btn-print').addEventListener('click', () => window.print());
  document.getElementById('btn-calcular').addEventListener('click', () => {
    // força recalculo lendo a tabela
    const tb = document.getElementById('tb-notas');
    let totalV = 0;
    let totalVol = 0;
    Array.from(tb.rows).forEach(r => {
      const v = r.cells[4] ? r.cells[4].textContent.replace(/[^\d,-]/g, '').replace(',', '.') : '0';
      const vol = r.cells[3] ? Number(r.cells[3].textContent || 0) : 0;
      totalV += parseFloat(v || 0);
      totalVol += Number(vol || 0);
    });
    document.getElementById('total-geral').textContent = `VALOR TOTAL: ${money(totalV)} | VOLUMES: ${totalVol}`;
  });

  // Caso queira testar localmente sem o postMessage, descomente e insira um payload de teste.
  // setTimeout(() => window.postMessage({ tipo:'romaneio:load', dadosRomaneio: window.__ROMANEIO_TEST__ }, window.location.origin), 700);

})(); 
</script>
</body>
</html>
